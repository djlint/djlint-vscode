# What the extension bundles. Run `uv lock` after changing it.
# requires-python must be the Python that Pyodide runs, so Renovate leaves it
# alone. When a Pyodide bump moves to a new Python, `npm run assets` fails until
# this is updated, and the python-version in the workflows has to follow.
[project]
name = "djlint-vscode"
version = "0"
requires-python = "==3.14.*"
dependencies = ["djlint==1.48.1"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
exclude-newer = "3 days"
exclude-newer-package = { djlint = false }
package = false

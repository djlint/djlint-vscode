name: ✨ Feature request
description: >-
  Suggest a new feature or an improvement to the djLint extension.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        New formatting options and lint rules belong in
        [djLint](https://github.com/djlint/djLint/issues/new/choose). This
        tracker is for the editor integration.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: >-
            I searched the [existing
            issues](https://github.com/djlint/djlint-vscode/issues?q=is%3Aissue)
            and found nothing about this.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What are you trying to do, and what gets in the way?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >-
        What should change? Be specific about the behavior you expect.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: How it would look in use.
      render: json
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.

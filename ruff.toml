line-length = 100
output-prefer-rule-codes = true
preview = true
# Where the scripts the tests import live.
src = ["build", "src/engine/pyodide"]
target-version = "py314"

[format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[lint]
future-annotations = true
ignore = [
  "ANN401",
  "ASYNC109",
  "BLE001",
  "C901",
  "COM812",
  "CPY001",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D403",
  "D415",
  "D417",
  "DJ008",
  "DOC201",
  "DOC402",
  "DOC501",
  "FURB180",
  "PLR0904",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0914",
  "PLR0915",
  "PLR0916",
  "PLR0917",
  "PLR1702",
  "PLW0717",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF105",
  "RUF201",
  "S110",
  "S112",
  "S308",
  "S311",
  "S404",
  "SIM105",
  "TD002",
  "TD003",
  "TRY400",
  "pytest-fixture-autouse",
]
select = ["ALL"]
unfixable = ["RUF027", "T"]

[lint.per-file-ignores]
# Scripts, not packages: Pyodide runs glue.py, and uv the build scripts.
"**/__tests__/*" = ["FBT001", "INP001", "S101", "T201", "PLR2004"]
"build/*" = ["INP001"]
"src/engine/pyodide/glue.py" = ["INP001"]

[lint.flake8-pytest-style]
warns-require-match-for = ["*"]

[lint.flake8-self]
ignore-names = ["_name_", "_value_"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-type-checking]
exempt-modules = []
strict = true

[lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[lint.pydocstyle]
convention = "google"

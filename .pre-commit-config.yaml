repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-xml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 1066584123cce44a99b4818c2b2c4a7e732ff8e9 # frozen: v1.11.3
    hooks:
      - id: tombi-format
        exclude: ^uv.lock$
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: 1fa61b696bac4277fb1ea87154eb3304a8bf9067 # frozen: v0.80.0
    hooks:
      - id: oxfmt
        language: node
        types_or:
          - text
        args:
          - --no-error-on-unmatched-pattern
        additional_dependencies:
          - oxfmt@0.80.0
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10 # frozen: v0.17.6
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  # mypy runs where the code does, in the environment uv.lock describes. A hook
  # environment would pin djLint again, and wait out the cooldown of each
  # release that uv.lock takes at once.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run --locked --group dev mypy
        args:
          - --scripts-are-modules
        types_or:
          - python
          - pyi
        require_serial: true
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8 # frozen: v1.33.1
    hooks:
      - id: zizmor
        args: [--no-progress, --persona=pedantic]
